# Draws the snake once a day and stores it on the "output" branch.
# The README loads snake-light.svg and snake-dark.svg from there.
name: Snake

on:
  schedule:
    - cron: "17 2 * * *"   # every night around 03:17 in Cologne
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0ea5e9
            dist/snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      - name: Push it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
